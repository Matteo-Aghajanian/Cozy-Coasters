<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cozy Coasters</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Cozy Coasters</h1>
    <p>Handcrafted coasters for every mug, cup, or glass!</p>
  </header>

  <main>
    <section class="products">
      <div class="product">
        <img src="coaster1.jpg" alt="Wooden Coaster">
        <h2>Wooden Coaster</h2>
        <p>$5.00</p>
        <button onclick="addToCart('Wooden Coaster', 5)">Add to Cart</button>
      </div>
      <div class="product">
        <img src="coaster2.jpg" alt="Marble Coaster">
        <h2>Marble Coaster</h2>
        <p>$8.00</p>
        <button onclick="addToCart('Marble Coaster', 8)">Add to Cart</button>
      </div>
    </section>

    <section class="cart">
      <h2>Your Cart</h2>
      <ul id="cart-items"></ul>
      <p>Total: $<span id="total">0</span></p>
      <button onclick="checkout()">Buy Now</button>
    </section>
  </main>

  <footer>
    <p>© 2025 Matteo's Coasters. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
